name: Publish CLI

# Publishes @dcodenischal/mcp-check to npm with provenance when a tag like cli-v0.1.2 is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere.
#
# To release: bump "version" in cli/package.json, run `npm run build:cli`, commit, then
#   git tag cli-v<version> && git push origin cli-v<version>

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow and record provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:cli
      - name: Bundles match the source
        run: git diff --exit-code -- cli/bin action || (echo "Run npm run build:cli and commit the result." && exit 1)
      - name: Tag matches the package version
        run: |
          version="$(node -p "require('./cli/package.json').version")"
          if [ "cli-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match cli/package.json version $version"
            exit 1
          fi
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
        working-directory: cli
