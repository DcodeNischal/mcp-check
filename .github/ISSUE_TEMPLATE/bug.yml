name: Bug report
description: Something in the website, MCP server, CLI or GitHub Action doesn't work.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Website, MCP server (/mcp), CLI, GitHub Action, Directory or search, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Steps to reproduce help a lot. Please don't paste tokens or private URLs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (CLI or Action)
      placeholder: e.g. 0.1.1, or v1
